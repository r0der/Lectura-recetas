<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banner Lectura de Recetas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .banner {
      width: 100%;
      max-width: 1752px;
      margin: 0 auto;
      user-select: none;
      pointer-events: none; /* BLOQUEA TODA INTERACCIÓN */
    }

    .banner img {
      width: 100%;
      display: block;
      border-radius: 24px;
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none; /* evita clicks sobre la imagen */
    }
  </style>
</head>
<body>

  <div class="banner">
    <img src="lectura11.png" alt="Lectura de Recetas Individual" draggable="false">
  </div>

</body>
</html>
